<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Design by foolishdeveloper.com -->
    <title>Log In</title>
 
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <SCript src="./Scripts/main.js"></SCript>
    <!--Stylesheet-->
    <style media="screen">
      *,
*:before,
*:after{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}
body{
    /* background-color: #080710; */
    background-image: url(/Assets/Images/bg\ image.jpg);
    background-size: cover;
}
.background{
    width: 430px;
    height: 520px;
    position: absolute;
    transform: translate(-50%,-50%);
    left: 50%;
    top: 50%;
}
.background .shape{
    height: 200px;
    width: 200px;
    position: absolute;
    border-radius: 50%;
}
.shape:first-child{
    background: linear-gradient(
        #1845ad,
        #23a2f6
    );
    left: -80px;
    top: -80px;
}
.shape:last-child{
    background: linear-gradient(
        to right,
        #ff512f,
        #f09819
    );
    right: -30px;
    bottom: -80px;
}
form{
    height: 520px;
    width: 400px;
    background-color: rgba(185, 180, 180, 0.692);
    /* opacity: 100px; */
    position: absolute;
    transform: translate(-50%,-50%);
    top: 50%;
    left: 50%;
    border-radius: 10px;
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 40px rgba(8,7,16,0.6);
    padding: 50px 35px;
}
form *{
    font-family: 'Poppins',sans-serif;
    color: #ffffff;
    letter-spacing: 0.5px;
    outline: none;
    border: none;
}
form h3{
    font-size: 32px;
    font-weight: 500;
    line-height: 42px;
    text-align: center;
}

label{
    display: block;
    margin-top: 30px;
    font-size: 16px;
    font-weight: 500;
}
input{
    display: block;
    height: 50px;
    width: 100%;
    background-color: rgba(255,255,255,0.07);
    border-radius: 3px;
    padding: 0 10px;
    margin-top: 8px;
    font-size: 14px;
    font-weight: 300;
    border-radius: 20px;
}
::placeholder{
    color: #e5e5e5;
}
button{
    background: rgb(199, 159, 0);
    padding: 1rem 1rem 1rem;
    text-align: center;
    font-size: 20px;
    color: rgb(50, 50, 50);
    border: 1px solid transparent;
    border-radius: 3.5rem;
    font-family: 'Dancing Script';
    margin-left: 110px;
    margin-top: 60px;
    filter: drop-shadow(0px 0px 25px rgba(22, 22, 22, 0.505));
}
button:hover{
    scale: 90%;
    filter: drop-shadow(0px 0px 5px rgba(22, 22, 22, 0.505));
    background: rgb(159, 130, 0);
}
.bi-x-lg {
    font-size: 2rem;
}
.back-anchor {
    background-color: rgba(255, 253, 253, 0.507);
    width: max-content;
    aspect-ratio: 4 / 4;
    display: flex;
    justify-content: center;
    padding: 2rem;
    border-radius: 100%;
    transition: all 0.2s ease-in-out;
    margin-left: 100px;
    margin-top: 100px;
}
.back-anchor:hover {
    scale: 80%;
    /* color: black; */
    /* background-color: black; */
}



    </style>
</head>
<body>
    <div class="h-100  container py-5" >
        <a onclick="goBack()" class="bi-x-lg back-anchor" style="color: rgb(7, 7, 7);" href="index.html"></a></div>

    <form>
        <h3>Login Here</h3>

        <label for="username">Username</label>
        <input type="text" placeholder="Email or username" id="username">

        <label for="password">Password</label>
        <input type="password" placeholder="Password" id="password">

        <button type="button" onclick="login()">Log In</button>
        <div id="message-box" style="display: none; border: 1px solid green; padding: 10px; background-color: #4ebff3; margin-top: 10px; text-align: center; border-radius: 20px;">
            <p id="message"></p>
        </div>
    </form>


    <script>
       function login() {
        // Get the values of the inputs
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Check if both fields are filled
        if (username === "" || password === "") {
            alert("Please fill in both the username and password fields.");
        } else {
            // Display success message in the message box
            document.getElementById('message').textContent = 'You have successfully logged in';
            document.getElementById('message-box').style.display = 'block'; // Show the message box
        }
    }
    </script>

</body>
</html>
